name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test
      - run: Scripts/build-app.sh
      - name: Sidebar UI test
        run: DUSTPAN_DEMO=1 DUSTPAN_UITEST=1 build/Dustpan.app/Contents/MacOS/Dustpan
        timeout-minutes: 3
